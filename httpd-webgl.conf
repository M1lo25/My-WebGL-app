# Caricamento dei moduli base
LoadModule mpm_event_module         modules/mod_mpm_event.so
LoadModule unixd_module             modules/mod_unixd.so
LoadModule authz_core_module        modules/mod_authz_core.so
LoadModule authz_host_module        modules/mod_authz_host.so
LoadModule dir_module               modules/mod_dir.so
LoadModule mime_module              modules/mod_mime.so
LoadModule headers_module           modules/mod_headers.so
LoadModule log_config_module        modules/mod_log_config.so
LoadModule deflate_module           modules/mod_deflate.so

# Document root e permessi
DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # — Disabilita completamente la cache per WebGL —
    Header always set Cache-Control "no-store, no-cache, must-revalidate"
    Header always set Pragma        "no-cache"
    Header always set Expires       "0"
</Directory>

# Log
ErrorLog "/usr/local/apache2/logs/error_log"
CustomLog "/usr/local/apache2/logs/access_log" common

# MIME e compressione .gz
<IfModule mime_module>
    AddEncoding gzip                  .gz
    AddType application/javascript    .js.gz
    AddType application/wasm          .wasm.gz
    AddType application/octet-stream  .data.gz
</IfModule>

<IfModule deflate_module>
    # Compressione per asset testuali e Wasm
    AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript application/wasm
    DeflateCompressionLevel 6
    DeflateMemLevel         4
</IfModule>

<IfModule headers_module>
    # Imposta header Content-Encoding sui file già compressi
    <FilesMatch "\.js\.gz$">
        Header set Content-Encoding gzip
    </FilesMatch>
    <FilesMatch "\.wasm\.gz$">
        Header set Content-Encoding gzip
    </FilesMatch>
    <FilesMatch "\.data\.gz$">
        Header set Content-Encoding gzip
    </FilesMatch>
</IfModule>

# Alias e Directory per WebGL
Alias /webgl/ "/usr/local/apache2/htdocs/webgl/"
<Directory "/usr/local/apache2/htdocs/webgl/">
    Require all granted
</Directory>

# Pagine di errore custom
ErrorDocument 403 /webgl/403.html

# Default document
DirectoryIndex index.html
