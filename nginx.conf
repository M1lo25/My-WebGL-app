user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream authapp { server auth-service:3000; }
    upstream webapp  { server web:80; }

    server {
        listen 80;
        server_name _;

        # 1) root → redirect al login
        location = / {
            return 302 /auth/login;
        }

        # 2) Auth‐service (login, logout, ecc.)
        location /auth/ {
            proxy_pass         http://authapp;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # 3) Endpoint interno per verifica sessione
        location = /auth/session-check {
            internal;
            proxy_pass            http://authapp/auth/session-check;
            proxy_set_header      Host            $host;
            proxy_set_header      X-Real-IP       $remote_addr;
            proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass_request_body off;
            proxy_set_header      Content-Length  "";
            proxy_set_header      Cookie          $http_cookie;
        }

        # 4) Risorse pubbliche (CSS e immagini della 403) senza auth
        location /css/ {
            alias      /usr/share/nginx/html/css/;
            auth_request off;
        }
        location /img/ {
            alias      /usr/share/nginx/html/img/;
            auth_request off;
        }

        # 5) WebGL protetto con session‐check
        location /webgl/ {
            auth_request        /auth/session-check;
            error_page 401 =403 /403.html;

            # Disabilita cache per gli asset WebGL
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma        "no-cache"                                               always;
            add_header Expires       "0"                                                     always;

            proxy_pass          http://webapp/webgl/;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade           $http_upgrade;
            proxy_set_header    Connection        "upgrade";
            proxy_set_header    Host              $host;
            proxy_cache_bypass  $http_upgrade;
        }

        # 6) Pagina custom Forbidden
        location = /403.html {
            internal;
            root /usr/share/nginx/html;
        }

        # 7) Pagina custom Not Found
        error_page 404 /404.html;
        location = /404.html {
            internal;
            root /usr/share/nginx/html;
        }
    }
}
